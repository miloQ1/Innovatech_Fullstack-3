services:
  mysql:
    image: mysql:8.0
    container_name: innovatech-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

  eureka-server:
    build: ./eureka-server
    container_name: innovatech-eureka-server
    ports:
      - "8761:8761"

  auth-service:
    build: ./authService-Innovatech
    container_name: innovatech-auth-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MS_RECURSOS_BASE_URL: http://ms-recursos:8083
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  proyects-service:
    build: ./proyectsService-Innovatech
    container_name: innovatech-proyects-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/proyectos_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MS_RECURSOS_BASE_URL: http://ms-recursos:8083
      MS_ASIGNACIONES_BASE_URL: http://ms-asignaciones:8091
      NOTIFICACIONES_BASE_URL: http://notificaciones:8085
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-clientes:
    build: ./ms-clientes
    container_name: innovatech-ms-clientes
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/clientes_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-recursos:
    build: ./ms_recursos_innovatech
    container_name: innovatech-ms-recursos
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/recursos_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-asignaciones:
    build: ./ms-asignaciones
    container_name: innovatech-ms-asignaciones
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: 8091
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/asignaciones_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      NOTIFICACIONES_BASE_URL: http://notificaciones:8085
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-colaboracion:
    build: ./ms_colaboracion_innovatech
    container_name: innovatech-ms-colaboracion
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/colaboracion_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MS_ASIGNACIONES_BASE_URL: http://ms-asignaciones:8091
      NOTIFICACIONES_BASE_URL: http://notificaciones:8085
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-archivos:
    build: ./ms-archivos
    container_name: innovatech-ms-archivos
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/archivos_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-auditoria:
    build: ./ms-auditoria
    container_name: innovatech-ms-auditoria
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auditoria_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  analitica-service:
    build: ./AnaliticaInnovatech-main
    container_name: innovatech-analitica-service
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/analitica_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  notificaciones:
    build: ./notificaciones/notificaciones
    container_name: innovatech-notificaciones
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notificaciones_db?useSSL=false&serverTimezone=America/Santiago
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  bff-gateway:
    build: ./bffGateway
    container_name: innovatech-bff-gateway
    ports:
      - "8090:8090"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started
      proyects-service:
        condition: service_started
      ms-clientes:
        condition: service_started
      ms-recursos:
        condition: service_started
      ms-asignaciones:
        condition: service_started
      ms-colaboracion:
        condition: service_started
      ms-archivos:
        condition: service_started
      ms-auditoria:
        condition: service_started
      analitica-service:
        condition: service_started
      notificaciones:
        condition: service_started

volumes:
  mysql_data:
