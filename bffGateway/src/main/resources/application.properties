# ── CORS global ───────────────────────────────────────────────
# El frontend web corre normalmente en 8100/5173. En Android Capacitor la app usa origen http://localhost.
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=http://localhost,http://localhost:5173,http://localhost:8100,http://127.0.0.1:5173,http://127.0.0.1:8100,http://10.0.2.2:8100,http://192.168.1.9:8100
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.default-filters[0].name=DedupeResponseHeader
spring.cloud.gateway.default-filters[0].args.name=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.default-filters[0].args.strategy=RETAIN_UNIQUE
